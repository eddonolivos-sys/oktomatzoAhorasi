services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../docs:/usr/share/docs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - shell
      - app-dashboard
      - app-viewer-3d
      - app-mundo-3d
      - app-combate-3d
      - game-server
      - space-server
      - redis
      - oktomatzo2-app
      - test-uno
      - test-dos
    environment:
      - DOMAIN=${DOMAIN:-localhost:8080}

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - backend_data:/app/data
    environment:
      - DB_PATH=/app/data/plataforma.db
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - PORT=8080

  shell:
    build:
      context: ..
      dockerfile: shell/Dockerfile
    restart: unless-stopped

  app-dashboard:
    build:
      context: ..
      dockerfile: apps/app-a-dashboard/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:80"

  app-viewer-3d:
    build:
      context: ..
      dockerfile: apps/app-b-viewer-3d/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:80"

  app-mundo-3d:
    build:
      context: ..
      dockerfile: apps/app-mundo-3d/Dockerfile
      args:
        VITE_CESIUM_ION_TOKEN: ${VITE_CESIUM_ION_TOKEN:-}
        VITE_MODEL_CAR_URL: ${VITE_MODEL_CAR_URL:-}
        VITE_MODEL_PLANE_URL: ${VITE_MODEL_PLANE_URL:-}
        VITE_MODEL_BOAT_URL: ${VITE_MODEL_BOAT_URL:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8087:80"

  app-combate-3d:
    build:
      context: ..
      dockerfile: apps/app-combate-3d/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"

  game-server:
    build:
      context: ../services/game-server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8080"

  redis:
    image: redis:alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:8092:6379"

  space-server:
    build:
      context: ../services/space-server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      - redis
    ports:
      - "127.0.0.1:8093:8080"

  oktomatzo2-api:
    build:
      context: ../apps/oktomatzo2/tattoo-preview/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8089:8000"
    environment:
      - MAX_UPLOAD_MB=10

  oktomatzo2-app:
    build:
      context: ../apps/oktomatzo2/tattoo-preview/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/oktomatzo2-api
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      - oktomatzo2-api

  test-uno:
    build:
      context: ..
      dockerfile: apps/test-uno/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:80"

  test-dos:
    build:
      context: ..
      dockerfile: apps/test-dos/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:80"

volumes:
  caddy_data:
  caddy_config:
  backend_data:
  redis_data:
