services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:8080"
    volumes:
      - ../proxy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - backend
      - shell
      - app-dashboard
      - app-viewer-3d
      - test-uno
      - test-dos

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    volumes:
      - backend_data:/app/data
    environment:
      - DB_PATH=/app/data/plataforma.db
      - JWT_SECRET=dev-secret-change-in-production
      - PORT=8080

  shell:
    build:
      context: ..
      dockerfile: shell/Dockerfile
    ports:
      - "8086:80"

  app-dashboard:
    build:
      context: ..
      dockerfile: apps/app-a-dashboard/Dockerfile
    ports:
      - "8082:80"

  app-viewer-3d:
    build:
      context: ..
      dockerfile: apps/app-b-viewer-3d/Dockerfile
    ports:
      - "8083:80"

  test-uno:
    build:
      context: ..
      dockerfile: apps/test-uno/Dockerfile
    ports:
      - "8084:80"

  test-dos:
    build:
      context: ..
      dockerfile: apps/test-dos/Dockerfile
    ports:
      - "8085:80"

volumes:
  caddy_data:
  backend_data:
