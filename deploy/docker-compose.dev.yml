# ADVERTENCIA: este compose está INCOMPLETO respecto a docker-compose.yml (prod).
# Faltan: redis, space-server, oktomatzo2-api/oktomatzo2-app y la ruta /space-ws
# del Caddyfile.dev. Un despliegue con este archivo queda SIN multijugador ni
# TattooAR. Para exponer a internet, componer docker-compose.internet.yml con
# docker-compose.yml (ver el comentario en ese archivo), NUNCA con este.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ../proxy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ../docs:/usr/share/docs:ro
      - caddy_data:/data
    depends_on:
      - backend
      - shell
      - app-dashboard
      - app-viewer-3d
      - app-mundo-3d
      - app-combate-3d
      - game-server
      - test-uno
      - test-dos

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - backend_data:/app/data
    environment:
      - DB_PATH=/app/data/plataforma.db
      - JWT_SECRET=dev-secret-change-in-production
      - PORT=8080

  shell:
    build:
      context: ..
      dockerfile: shell/Dockerfile
    restart: unless-stopped
    ports:
      - "8086:80"

  app-dashboard:
    build:
      context: ..
      dockerfile: apps/app-a-dashboard/Dockerfile
    restart: unless-stopped
    ports:
      - "8082:80"

  app-viewer-3d:
    build:
      context: ..
      dockerfile: apps/app-b-viewer-3d/Dockerfile
    restart: unless-stopped
    ports:
      - "8083:80"

  app-mundo-3d:
    build:
      context: ..
      dockerfile: apps/app-mundo-3d/Dockerfile
      args:
        VITE_CESIUM_ION_TOKEN: ${VITE_CESIUM_ION_TOKEN:-}
        VITE_MODEL_CAR_URL: ${VITE_MODEL_CAR_URL:-}
        VITE_MODEL_PLANE_URL: ${VITE_MODEL_PLANE_URL:-}
        VITE_MODEL_BOAT_URL: ${VITE_MODEL_BOAT_URL:-}
    restart: unless-stopped
    ports:
      - "8087:80"

  app-combate-3d:
    build:
      context: ..
      dockerfile: apps/app-combate-3d/Dockerfile
    restart: unless-stopped
    ports:
      - "8088:80"

  game-server:
    build:
      context: ../services/game-server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8080"

  test-uno:
    build:
      context: ..
      dockerfile: apps/test-uno/Dockerfile
    restart: unless-stopped
    ports:
      - "8084:80"

  test-dos:
    build:
      context: ..
      dockerfile: apps/test-dos/Dockerfile
    restart: unless-stopped
    ports:
      - "8085:80"

volumes:
  caddy_data:
  backend_data:
