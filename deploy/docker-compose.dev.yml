services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:8080"
    volumes:
      - ../proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - ../shell/dist:/usr/share/shell
    depends_on:
      - backend
      - app-dashboard
      - app-viewer-3d

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    volumes:
      - backend_data:/app/data
    environment:
      - DB_PATH=/app/data/plataforma.db
      - JWT_SECRET=dev-secret-change-in-production
      - PORT=8080

  app-dashboard:
    build:
      context: ../apps/app-a-dashboard
      dockerfile: Dockerfile
    ports:
      - "8082:80"

  app-viewer-3d:
    build:
      context: ../apps/app-b-viewer-3d
      dockerfile: Dockerfile
    ports:
      - "8083:80"

volumes:
  caddy_data:
  backend_data:
