# Exposición a internet vía Cloudflare Tunnel
# Uso: docker compose -f deploy/docker-compose.dev.yml -f deploy/docker-compose.internet.yml up --build -d
services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://caddy:8080
    depends_on:
      - caddy
    restart: unless-stopped
