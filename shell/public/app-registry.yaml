    route: /viewer-3d
    src: /apps/viewer-3d/
    version: 1.0.0
    sandbox: "allow-scripts allow-same-origin"
    category: Herramientas
    tags:
      - threejs
      - webgl

  - id: combate-3d
    name: Combate 3D
