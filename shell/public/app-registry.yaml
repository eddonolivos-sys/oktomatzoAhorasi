apps:
  - id: dashboard
    name: Dashboard Comercial
    description: Métricas y reportes de ventas
    blurb: Panel comercial con métricas, reportes y gráficos de ventas en tiempo real.
    icon: bar-chart
    route: /dashboard
    src: /apps/dashboard/
    version: 1.0.0
    sandbox: "allow-scripts allow-same-origin allow-forms"
    category: Analítica
    tags:
      - react
      - chartjs

  - id: viewer-3d
    name: Visor 3D
    description: Visualización interactiva de modelos 3D
