<style>

<body>
<div class="container">
  <h1>🔍 Búsqueda inteligente</h1>
  <p class="subtitle">Busca en la documentación. Haz clic en cualquier resultado para ver su contenido completo aquí mismo.</p>

    <span class="stats" id="stats"></span>
  </div>
  <div id="results"></div>
</div>

<script>
// ── RUTA FIJA DEL PROYECTO (cambiar si se mueve el repositorio) ───────
const PROJECT_ROOT = 'C:\\Users\\victo\\OneDrive\\Documentos\\GitHub\\oktomatzoAhorasi';

// ── Search Engine ──────────────────────────────────────────────────────
const stopWords = new Set(['el','la','los','las','de','del','en','un','una','y','e','o','a','al','con','por','para','es','se','su','que','no','lo','como','más','pero','sus','le','ya','este','entre','todo','esta','dos','muy','sin']);

function tokenize(text) {
  return text.toLowerCase()
    .replace(/[^a-záéíóúñü0-9\s-]/g, ' ')
    .split(/\s+/)
    .filter(Boolean);
}

function buildIndex(docs) {
  const index = [];
  for (const doc of docs) {
    const tokens = tokenize(doc.content);
    const tf = new Map();
    for (const t of tokens) if (!stopWords.has(t)) tf.set(t, (tf.get(t) || 0) + 1);
    const maxFreq = Math.max(...tf.values(), 1);
    index.push({ ...doc, tokens: [...tf.keys()], tf, maxFreq });
  }
  const totalDocs = index.length;
  const df = new Map();
  for (const doc of index) {
    for (const t of new Set(doc.tokens)) df.set(t, (df.get(t) || 0) + 1);
  }
  for (const doc of index) {
    doc.idf = new Map();
    for (const t of doc.tokens) doc.idf.set(t, Math.log((totalDocs + 1) / ((df.get(t) || 0) + 1)) + 1);
  }
  return index;
}

function search(query, index) {
  const qTokens = tokenize(query).filter(t => !stopWords.has(t));
  if (qTokens.length === 0) return [];
  const results = [];
  for (const doc of index) {
    let score = 0;
    for (const qt of qTokens) {
      const freq = (doc.tf.get(qt) || 0) / doc.maxFreq;
      score += freq * (doc.idf.get(qt) || 1);
    }
    const exactBonus = query.length > 2 && doc.content.toLowerCase().includes(query.toLowerCase()) ? 3 : 0;
    score += exactBonus;
    if (score > 0) results.push({ ...doc, score: Math.round(score * 1000) / 1000 });
  }
  results.sort((a, b) => b.score - a.score);
  return results.slice(0, 30);
}

function getExcerpt(content, query) {
  const q = query.toLowerCase();
  const idx = content.toLowerCase().indexOf(q);
  if (idx === -1) return content.slice(0, 200) + (content.length > 200 ? '...' : '');
  const start = Math.max(0, idx - 80);
  const end = Math.min(content.length, idx + q.length + 120);
  let excerpt = (start > 0 ? '…' : '') + content.slice(start, end) + (end < content.length ? '…' : '');
  excerpt = excerpt.replace(new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `<em>${m}</em>`);
  return excerpt;
}

const DOCS = [
  { id:'architecture', title:'Arquitectura del sistema', section:'docs/architecture.md', file:'docs/architecture.md',
    content:`Plataforma Orquestadora — Arquitectura.\n\n5 principios de diseño:\n1. Máximo aislamiento entre sub-aplicaciones\n2. Agnóstico al stack tecnológico\n3. Comunicación mínima (solo postMessage)\n4. Despliegue independiente por app\n5. Simplicidad operacional\n\nDiagrama de arquitectura:\nCaddy (proxy reverso) -> Shell SPA + Sub-apps (iframes) -> Backend API (Go) -> SQLite\n\nFlujo de autenticación:\nUsuario -> Shell -> Backend (JWT) -> Shell almacena token -> reenvía a iframe via postMessage\n\nDecisiones técnicas:\n- Shell: Lit + Web Components (<10KB JS)\n- Backend: Go + SQLite (binario único)\n- Proxy: Caddy (auto HTTPS)\n- Aislamiento: iframes con postMessage\n- Base de datos: SQLite con migraciones automáticas y seed de apps` },
  { id:'protocol', title:'Protocolo de comunicación (postMessage)', section:'docs/protocol.md', file:'docs/protocol.md',
    content:`Protocolo de comunicación entre Shell y sub-aplicaciones via postMessage.\n\nMensajes Shell -> App:\n- auth:token — Envía token JWT y datos del usuario\n- auth:clear — Limpia la sesión (logout)\n- theme — Cambia entre tema claro/oscuro\n- navigate — Navega a otra ruta\n- shell:ready — Indica que la shell está lista\n\nMensajes App -> Shell:\n- app:ready — La app terminó de cargar\n- auth:request — Solicita el token de autenticación\n- navigate — Solicita navegar a otra app\n- resize — Reporta altura dinámica del iframe\n- notify — Muestra una notificación en la shell\n\nComunicación cross-app: via shell como intermediario.` },
  { id:'adding-new-app', title:'Guía para añadir nueva sub-app', section:'docs/adding-new-app.md', file:'docs/adding-new-app.md',
    content:`Guía completa para integrar nuevas aplicaciones al ecosistema.\n\nContexto: Monorepo con pnpm workspaces. El build context SIEMPRE debe ser la raíz del repo.\n\nPasos:\n1. Crear estructura: apps/mi-app/ (package.json, tsconfig, vite.config)\n2. Integrar protocolo: importar ShellClient de @plataforma/shell-protocol\n3. Crear Dockerfile (sin COPY shell/)\n4. Añadir a docker-compose.yml y docker-compose.dev.yml\n5. Configurar ruta en Caddyfile (handle_path /apps/mi-app/*)\n6. Registrar en la base de datos vía API o en app-registry.yaml\n\nChecklist de 10 pasos incluido en la documentación.` },
  { id:'deployment', title:'Despliegue y Cloudflare Tunnel', section:'docs/deployment.md', file:'docs/deployment.md',
    content:`Tres opciones de despliegue:\n\n1. LOCAL (desarrollo): docker-compose.dev.yml, hot-reload sin Docker\n   URL: http://localhost:8080\n\n2. VPS (producción): Hetzner CX22 (~5 EUR/mes)\n   Requiere Docker, clonar repo, configurar .env, docker-compose up\n\n3. CLOUDFLARE TUNNEL (gratuito, desde casa)\n   - Rápido: docker compose -f deploy/docker-compose.dev.yml -f deploy/docker-compose.internet.yml up\n   - Permanente: cloudflared tunnel login + create + route dns\n\nPuertos: Caddy 8080, Backend 8081, Dashboard 8082, Visor 3D 8083,\nTest Uno 8084, Test Dos 8085, Shell 8086, Mundo 3D 8087,\nCombate 3D 8088, Oktomatzo2 API 8089, Oktomatzo2 App 8090.\n\nVariables de entorno: DOMAIN, JWT_SECRET, DB_PATH, PORT.` },
  { id:'combate-3d', title:'Combate 3D — Juego vehicular', section:'apps/app-combate-3d/', file:'apps/app-combate-3d/src/Game.ts',
    content:`Juego de combate vehicular en 3D con Three.js.\n\nVehículo: cuerpo azul con geometrías regulares, cañón superior.\nControles: WASD para movimiento, ESPACIO para disparar.\n\nObjetos peligrosos: cubos rojos brillantes de 5x5m que caen cada 5 segundos (10 por oleada).\n- Si caen directamente sobre el vehículo: muerte instantánea.\n- Si chocas contra ellos: pierdes 25 de vida.\n- Aparecen a una distancia mínima de 25m del vehículo.\n\nSistema de vida: barra dinámica (verde -> naranja -> rojo).\nAl llegar a 0: el vehículo se detiene, colisiones desactivadas.\n\nCámara: tercera persona con lerp suave. Tecla C alterna distancia.\nCooldown de disparo: 0.6s con indicador visual de recarga.\n\nEfectos: explosiones de partículas, rastro en proyectiles, parpadeo al recibir daño.\n\nReinicio: tecla R o botón. 3 segundos de invulnerabilidad al reaparecer.` },
  { id:'mundo-3d', title:'Mundo 3D — CesiumJS Globe', section:'apps/app-mundo-3d/', file:'apps/app-mundo-3d/src/main.ts',
    content:`Visualización de globo terráqueo con CesiumJS.\n\nCapas de mapa:\n- Satélite (Cesium Ion asset 2)\n- Callejero (OpenStreetMap)\n- Topográfico (ArcGIS)\n\nSistema de clima: despejado, nublado, cubierto.\nCiclo día/noche con aceleración temporal 60x.\n\nVehículos: coche, avión, barco con física ENU, colisión contra terreno.\nCámara: modo follow y free (tecla V).\n\nHUD: latitud, longitud, altitud, velocidad, heading.\nRequiere token de Cesium Ion (VITE_CESIUM_ION_TOKEN).` },
  { id:'viewer-3d', title:'Visor 3D — Three.js', section:'apps/app-b-viewer-3d/', file:'apps/app-b-viewer-3d/src/main.ts',
    content:`Visualizador 3D simple con Three.js.\n\nEscena con icosaedro metálico azul, OrbitControls para interacción,\nsistema de partículas flotantes, plano de suelo con soporte de sombras.\n\nIntegración con protocolo ShellClient para:\n- Autenticación (auth:token)\n- Tema claro/oscuro\n- Reporte de altura del iframe` },
  { id:'tattooar', title:'TattooAR — Previsualización 3D de Tatuajes', section:'apps/oktomatzo2/', file:'apps/oktomatzo2/tattoo-preview/frontend/src/app/page.tsx',
    content:`TattooAR: Aplicación para previsualizar tatuajes en modelos 3D.\n\nFrontend: Next.js 14 + Three.js + Tailwind CSS\nBackend: FastAPI (Python) con rembg para eliminación de fondo\n\nFuncionalidades:\n- Selecciona zonas corporales (cabeza, torso, brazos, piernas)\n- Sube diseños PNG, SVG, JPG, WebP (máx 10 MB)\n- Los JPG/WebP eliminan fondo automáticamente vía IA\n- Coloca tatuajes en el modelo 3D haciendo clic\n- Editor: posición, rotación, escala, opacidad, brillo, saturación, tono\n- 5 presets de iluminación\n- Modelo corporal procedimental con 18 partes\n\nEndpoints API:\n- POST /api/process-texture (PNG/SVG)\n- POST /api/remove-background (JPG/WebP)\n- GET /health` },
  { id:'backend-api', title:'Backend API — Go', section:'backend/', file:'backend/cmd/api/main.go',
    content:`API backend en Go con arquitectura hexagonal.\n\nEndpoints:\n- POST /api/auth/register — Registro de usuario\n- POST /api/auth/login — Inicio de sesión (JWT)\n- GET /api/auth/me — Datos del usuario actual\n- GET /api/apps — Listar aplicaciones\n- GET /api/apps/{id} — Detalle de app\n- POST /api/apps — Crear app\n- PUT /api/apps/{id} — Actualizar app\n- DELETE /api/apps/{id} — Eliminar app\n- GET /api/users — Listar usuarios (admin)\n- PUT /api/users/{id} — Actualizar usuario\n- DELETE /api/users/{id} — Eliminar usuario\n\nBase de datos: SQLite con migraciones automáticas.\nSeed de apps al arrancar si la tabla está vacía.\nAutenticación: JWT con bcrypt.\nMiddleware: CORS, logging, autenticación.` },
  { id:'shell', title:'Shell SPA — Lit + Web Components', section:'shell/', file:'shell/src/components/shell-app.ts',
    content:`Shell orquestadora construida con Lit y Web Components.\n\nComponentes:\n- shell-app: componente raíz que gestiona el layout completo\n- shell-topbar: barra superior con menú, marca, tema y usuario\n- shell-sidebar: barra lateral con apps agrupadas por categoría\n- shell-app-container: contenedor iframe para las sub-apps\n- shell-login: formulario de inicio de sesión y registro\n\nTemas: claro/oscuro con CSS variables, persistido en localStorage.\nCarga de apps: desde API /api/apps con fallback a app-registry.yaml.\nComunicación con sub-apps: postMessage.` },
  { id:'env-setup', title:'Variables de entorno', section:'deploy/.env.example', file:'deploy/.env.example',
    content:`Variables de entorno del sistema:\n\nDOMAIN — Dominio para Caddy (auto HTTPS)\nJWT_SECRET — Secreto para firmar tokens JWT\nDEBUG — Modo debug (true/false)\nVITE_CESIUM_ION_TOKEN — Token de Cesium Ion para Mundo 3D\nVITE_MODEL_CAR_URL — URL del modelo 3D del coche\nVITE_MODEL_PLANE_URL — URL del modelo 3D del avión\nVITE_MODEL_BOAT_URL — URL del modelo 3D del barco\nNEXT_PUBLIC_API_URL — URL de la API para Oktomatzo2\nMAX_UPLOAD_MB — Tamaño máximo de subida (MB)` },
  { id:'docker-setup', title:'Docker Compose y servicios', section:'deploy/', file:'deploy/docker-compose.yml',
    content:`11 servicios Docker:\n\n- caddy: proxy reverso con auto HTTPS\n- backend: API Go con SQLite\n- shell: SPA Lit + Web Components\n- app-dashboard: Dashboard React + Recharts\n- app-viewer-3d: Visor Three.js\n- app-mundo-3d: Globo CesiumJS\n- app-combate-3d: Juego Three.js\n- oktomatzo2-app: TattooAR Next.js\n- oktomatzo2-api: FastAPI Python\n- test-uno: App de prueba 1\n- test-dos: App de prueba 2\n\nBuild context: siempre desde la raíz del repo.\nCloudflare Tunnel: cloudflared sidecar para exposición a internet.` },
  { id:'system-guide', title:'Guía del Sistema', section:'docs/system-guide.md', file:'docs/system-guide.md',
    content:`Guía completa del sistema.\n\nIncluye:\n- Comandos de limpieza Docker (down -v, prune, rm)\n- Tabla completa de apps integradas con IDs, rutas y puertos\n- Instrucciones de búsqueda inteligente\n- Configuración de Cloudflare Tunnel para internet\n- Reconstrucción desde cero` },
  { id:'search', title:'Búsqueda inteligente', section:'docs/search.html', file:'docs/search.html',
    content:`Motor de búsqueda integrado en la plataforma.\n\nAlgoritmo: TF-IDF con tokenización en español, filtrado de stop words,\nnormalización de términos, ranking por relevancia y bonus por coincidencia exacta.\n\nDocumentos indexados: arquitectura, protocolo, despliegue, todas las apps,\nvariables de entorno, guías.\n\nInteracción: haz clic en cualquier resultado para ver el contenido completo\nen el mismo panel. Botón para seleccionar carpeta local y obtener rutas\npara el explorador de Windows.` }
];

// ── Fixed project root ─────────────────────────────────────────────────
function formatFileUrl(relativePath) {
  const normalized = PROJECT_ROOT.replace(/\\/g, '/') + '/' + relativePath.replace(/\\/g, '/');
  return 'file:///' + normalized.replace(/^file:\/\/\//, 'file:///');
}

function validateStructure() {
  // Check from the docs corpus that common directories exist in the path string
  // (client-side validation is limited, so we just display the path)
  return true;
}

const pathErrorEl = document.getElementById('pathError');
if (!validateStructure()) {
  pathErrorEl.textContent = '⚠️ La ruta del proyecto no contiene las carpetas esperadas. Revisa PROJECT_ROOT en search.html.';
  pathErrorEl.style.display = 'block';
} else {
  document.getElementById('projectPathDisplay').textContent = PROJECT_ROOT;
}

document.getElementById('copyPathBtn').addEventListener('click', () => {
  copyToClipboard(PROJECT_ROOT);
  document.getElementById('copyPathBtn').textContent = '✓ Copiado';
  setTimeout(() => { document.getElementById('copyPathBtn').textContent = '📋 Copiar ruta'; }, 2000);
});

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  });
}

// ── Init ───────────────────────────────────────────────────────────────
const index = buildIndex(DOCS);
const input = document.getElementById('searchInput');
const resultsDiv = document.getElementById('results');
const statsDiv = document.getElementById('stats');
let openDetailId = null;

function toggleDetail(id) {
  openDetailId = (openDetailId === id) ? null : id;
  render();
}

function render() {
  const q = input.value.trim();
  if (!q) {
    resultsDiv.innerHTML = '<div class="no-results">🔍 Escribe algo para buscar en la documentación</div>';
    statsDiv.textContent = `${DOCS.length} documentos indexados | Ruta fija activa`;
    return;
  }
  const res = search(q, index);
  statsDiv.textContent = `${res.length} resultado${res.length !== 1 ? 's' : ''} para "${q}" (de ${DOCS.length} documentos)`;
  if (res.length === 0) {
    resultsDiv.innerHTML = '<div class="no-results">Sin resultados. Intenta con otras palabras.</div>';
    return;
  }

  resultsDiv.innerHTML = res.map(r => {
    const isOpen = openDetailId === r.id;
    const fullPath = PROJECT_ROOT.replace(/\\/g, '/') + '/' + r.file.replace(/\\/g, '/');
    const fileUrl = 'file:///' + fullPath;
    const icons = { architecture:'🏛️', protocol:'📡', 'adding-new-app':'📖', deployment:'🚀', 'combate-3d':'🎮', 'mundo-3d':'🌍', 'viewer-3d':'🥽', tattooar:'💉', 'backend-api':'⚙️', shell:'🖥️', 'env-setup':'🔐', 'docker-setup':'🐳', 'system-guide':'📋', search:'🔍' };
    const icon = icons[r.id] || '📄';

    return `
    <div class="result">
      <div class="result-header" onclick="toggleDetail('${r.id}')">
        <div class="result-icon">${icon}</div>
        <div class="result-body">
          <div class="result-title">${r.title}</div>
          <div class="result-meta">
            <span>${r.section}</span>
            <span>Relevancia: ${r.score}</span>
          </div>
          ${!isOpen ? `<div class="result-excerpt">${getExcerpt(r.content, q)}</div>` : ''}
        </div>
      </div>
      <div class="result-detail ${isOpen ? 'open' : ''}">
        <pre>${r.content}</pre>
        <div class="detail-actions">
          <button class="detail-btn" onclick="copyToClipboard(\`${r.content.replace(/`/g, '\\`')}\`);this.nextElementSibling.textContent='✓ Copiado';setTimeout(()=>this.nextElementSibling.textContent='',2000)">📋 Copiar contenido</button>
          <button class="detail-btn" onclick="copyToClipboard('${fullPath}');this.nextElementSibling.textContent='✓ Ruta copiada';setTimeout(()=>this.nextElementSibling.textContent='',2000)">📋 Copiar ruta completa</button>
          <button class="detail-btn" onclick="window.open('${fileUrl}','_blank');this.nextElementSibling.textContent='✓ Abierto';setTimeout(()=>this.nextElementSibling.textContent='',2000)">📂 Abrir en Explorer</button>
          <span class="copied-msg"></span>
        </div>
        <div style="margin-top:8px;font-size:11px;color:#666;">${fullPath}</div>
      </div>
    </div>`;
  }).join('');
}

input.addEventListener('input', render);
render();
</script>
</body>
</html>
