  .result-links a {

<body>
<div class="container">
  <h1>🔍 Búsqueda inteligente</h1>
  <p class="subtitle">Busca en toda la documentación del proyecto. Resultados con enlaces al explorador de Windows.</p>

  <div class="stats" id="stats"></div>
  <div id="results"></div>
</div>

<script>
// ── Search Engine: tokenizer + TF scoring ──────────────────────────────
const PROJECT_ROOT = 'C:\\Users\\victo\\OneDrive\\Documentos\\GitHub\\oktomatzoAhorasi';

function tokenize(text) {
  return text.toLowerCase()
    .replace(/[^a-záéíóúñü0-9\s-]/g, ' ')
    .split(/\s+/)
    .filter(Boolean);
}

function buildIndex(docs) {
  const index = [];
  for (const doc of docs) {
    const tokens = tokenize(doc.content);
    const tf = new Map();
    for (const t of tokens) tf.set(t, (tf.get(t) || 0) + 1);
    const maxFreq = Math.max(...tf.values(), 1);
    index.push({
      ...doc,
      tokens,
      tf,
      maxFreq,
      length: tokens.length,
    });
  }
  return index;
}

function search(query, index) {
  const qTokens = tokenize(query);
  if (qTokens.length === 0) return [];
  const idf = new Map();
  for (const qt of new Set(qTokens)) {
    let count = 0;
    for (const doc of index) if (doc.tokens.includes(qt)) count++;
    idf.set(qt, Math.log((index.length + 1) / (count + 1)) + 1);
  }
  const results = [];
  for (const doc of index) {
    let score = 0;
    for (const qt of qTokens) {
      const freq = (doc.tf.get(qt) || 0) / doc.maxFreq;
      score += freq * (idf.get(qt) || 1);
    }
    const exactBonus = query.length > 2 && doc.content.toLowerCase().includes(query.toLowerCase()) ? 2 : 0;
    score += exactBonus;
    if (score > 0) {
      results.push({ ...doc, score: Math.round(score * 1000) / 1000 });
    }
  }
  results.sort((a, b) => b.score - a.score);
  return results.slice(0, 25);
}

function getExcerpt(content, query) {
  const q = query.toLowerCase();
  const idx = content.toLowerCase().indexOf(q);
  if (idx === -1) return content.slice(0, 200) + (content.length > 200 ? '...' : '');
  const start = Math.max(0, idx - 80);
  const end = Math.min(content.length, idx + q.length + 120);
  let excerpt = (start > 0 ? '…' : '') + content.slice(start, end) + (end < content.length ? '…' : '');
  const regex = new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  excerpt = excerpt.replace(regex, m => `<em>${m}</em>`);
  return excerpt;
}

function filePathToWebUrl(fp) {
  return fp.replace(/\\/g, '/').replace(PROJECT_ROOT.replace(/\\/g, '/'), '');
}

// ── Document Corpus ────────────────────────────────────────────────────

  },
  {

    section: 'docs/adding-new-app.md',
    file: PROJECT_ROOT + '\\docs\\adding-new-app.md',
    content: `Guía completa para integrar nuevas aplicaciones al ecosistema. Monorepo con pnpm workspaces. El build context siempre debe ser la raíz del repo. Pasos: crear estructura de la app (package.json, vite.config, tsconfig), integrar protocolo ShellClient, crear Dockerfile (sin COPY shell/), añadir a docker-compose, configurar ruta en Caddyfile, registrar en la base de datos vía API o en app-registry.yaml. Checklist de integración de 10 pasos.`
  },
  {

    title: 'Despliegue',
    section: 'docs/deployment.md',
    file: PROJECT_ROOT + '\\docs\\deployment.md',
    content: `Tres opciones de despliegue: Local/Desarrollo (docker-compose.dev.yml, hot-reload sin Docker), VPS económico (Hetzner CX22 ~5 EUR/mes), Cloudflare Tunnel gratuito para hosting desde casa. Variables de entorno: DOMAIN, JWT_SECRET, DB_PATH, PORT. Puertos en modo desarrollo: Caddy 8080, Backend 8081, Dashboard 8082, Visor 3D 8083, Test Uno 8084, Test Dos 8085, Shell 8086, Mundo 3D 8087, Combate 3D 8088. Respaldo manual y automático de SQLite. Monitoreo con logs y health check. CI/CD con GitHub Actions.`
  },
  {
    id: 'combate-3d',
    title: 'Combate 3D — Juego vehicular',
    section: 'apps/app-combate-3d/',
    file: PROJECT_ROOT + '\\apps\\app-combate-3d\\src\\Game.ts',
    content: `Juego de combate vehicular en 3D con Three.js. Vehículo azul con controles WASD, cañón que dispara balas con espacio, objetos peligrosos rojos que caen cada 5 segundos. Barra de vida con color dinámico verde-naranja-rojo. Cámara en tercera persona con lerp suave, tecla C para alternar distancia. Cooldown de disparo con indicador visual. Muerte instantánea si objeto cae sobre el vehículo. Sistema de reinicio con 3 segundos de invulnerabilidad. Detección de frustración (3 muertes en 30s muestra consejo). Efectos de partículas en explosiones. Sin localStorage ni persistencia.`

// ── Init ───────────────────────────────────────────────────────────────
const index = buildIndex(DOCS);
const input = document.getElementById('searchInput');
const resultsDiv = document.getElementById('results');
const statsDiv = document.getElementById('stats');

function render() {
  const q = input.value.trim();
  if (!q) {
    resultsDiv.innerHTML = '<div class="no-results">Escribe algo para buscar en la documentación</div>';
    statsDiv.textContent = `${DOCS.length} documentos indexados`;
    return;
  }
  const res = search(q, index);
  statsDiv.textContent = `${res.length} resultado${res.length !== 1 ? 's' : ''} para "${q}" (de ${DOCS.length} documentos)`;
  if (res.length === 0) {
    resultsDiv.innerHTML = '<div class="no-results">Sin resultados. Intenta con otras palabras.</div>';
    return;
  }
  resultsDiv.innerHTML = res.map(r => `
    <div class="result">
      <div class="result-title">${r.title} <span class="badge badge-section">${r.section}</span></div>
      <div class="result-excerpt">${getExcerpt(r.content, q)}</div>
      <div class="result-links">
        <a class="link-web" href="${filePathToWebUrl(r.file)}" target="_blank" title="Abrir en el navegador">🌐 Ver en web</a>
        <a class="link-file" href="file:///${r.file.replace(/\\/g, '/')}" target="_blank" title="Abrir en el explorador de Windows">📂 Abrir en Explorer</a>
      </div>
      <div class="result-score">Relevancia: ${r.score}</div>
    </div>
  `).join('');
}

input.addEventListener('input', render);
render();
</script>
