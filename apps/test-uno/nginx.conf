server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Direct access: handle base path /apps/test-uno/
    location /apps/test-uno/ {
        alias /usr/share/nginx/html/;
        try_files $uri /index.html;
    }

    # Caddy-proxied access: prefix already stripped
    location / {
        try_files $uri $uri/ /index.html;
    }
}
