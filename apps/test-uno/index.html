<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto de prueba 1</title>
  <style>
    :root {
      --bg: #f4f7fc;
      --surface: #ffffff;
      --surface-2: #f8fafd;
      --text: #0d1117;
      --text-secondary: #6b7280;
      --border: rgba(0, 0, 0, 0.07);
      --border-bright: rgba(0, 0, 0, 0.13);
      --accent: #4f46e5;
      --success: #16a34a;
      --grain: rgba(16, 24, 40, 0.015);
      --radius: 18px;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --elev: 0 8px 24px rgba(16, 24, 40, 0.08), 0 2px 6px rgba(16, 24, 40, 0.05);
      color-scheme: light;
    }
    [data-theme='dark'] {
      --bg: #020817;
      --surface: #0b1120;
      --surface-2: #111827;
      --text: #eef2ff;
      --text-secondary: #8892a4;
      --border: rgba(255, 255, 255, 0.07);
      --border-bright: rgba(255, 255, 255, 0.14);
      --accent: #6366f1;
      --success: #22c55e;
      --grain: rgba(255, 255, 255, 0.012);
      --elev: 0 12px 28px rgba(0, 0, 0, 0.6), 0 2px 6px rgba(0, 0, 0, 0.45);
      color-scheme: dark;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background:
        radial-gradient(120% 70% at 50% -10%, var(--surface-2), transparent 60%),
        var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background 0.4s var(--ease-out);
    }
    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(var(--grain) 1px, transparent 1px);
      background-size: 4px 4px;
    }
    .card {
      position: relative;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 48px 56px;
      text-align: center;
      border: 1px solid var(--border);
      box-shadow: var(--elev);
      animation: cardIn 0.55s var(--ease-out) both;
      overflow: hidden;
    }
    .numero {
      font-size: 88px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.03em;
      color: var(--text);
      opacity: 0.06;
    }
    h1 {
      font-size: 28px;
      font-weight: 650;
      letter-spacing: -0.02em;
      margin: 14px 0 8px;
      color: var(--text);
    }
    p {
      font-size: 14.5px;
      color: var(--text-secondary);
      line-height: 1.65;
    }
    .status {
      margin-top: 26px;
      padding: 8px 16px;
      border-radius: 22px;
      background: var(--surface-2);
      border: 1px solid var(--border-bright);
      font-size: 13px;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: color 0.3s var(--ease-out), border-color 0.3s var(--ease-out);
    }
    .status .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }
    .status.ok { color: var(--success); border-color: color-mix(in srgb, var(--success) 30%, transparent); }
    .status.running { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
      body { transition: none; }
    }
  </style>
</head>
<body>
  <div class="grain"></div>
  <div class="card">
    <div class="numero">01</div>
    <h1>Proyecto de prueba 1</h1>
    <p>Esta aplicación verifica que la plataforma orquestadora<br>carga correctamente las sub-apps en iframes.</p>
    <div class="status" id="status"><span class="dot"></span><span id="status-text">Esperando autenticación</span></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
